<main>
  <aside class="left">
    <section class="panel"><h2 class="panel-title"><span class="seal" aria-hidden="true"><img data-decoration="stepsBadge" alt="" hidden><span>版</span></span>体验步骤</h2>
      <ol class="steps">
        <li><button data-step="0"><span class="number">1</span><span><strong>择纹寄意</strong><small>选择喜欢的吉祥纹样，把美好心愿寄于针线</small></span></button></li>
        <li><button data-step="1"><span class="number">2</span><span><strong>观形辨色</strong><small>观察花叶的对称与层次，预选深浅丝线</small></span></button></li>
        <li><button data-step="2"><span class="number">3</span><span><strong>运针起形</strong><small>沿纹样轮廓观察针向，感受丝线的起伏</small></span></button></li>
        <li><button data-step="3"><span class="number">4</span><span><strong>修纹见韵</strong><small>细看纹理与留白，让纹样疏密有致</small></span></button></li>
      </ol>
    </section>
    <section class="panel"><div class="panel-title"><span class="seal" aria-hidden="true"><img data-decoration="patternsBadge" alt="" hidden><span>绣</span></span><span>丝线与针法</span></div>
      <div class="stitch-tools">
        <div id="thread-colors" aria-label="选择丝线颜色"></div><p id="thread-color-label"></p>
        <div class="stitch-methods" aria-label="选择针法"><button data-method="flat" aria-pressed="true"><i class="thread-sample"></i>平针</button><button data-method="long-short" aria-pressed="false"><i class="thread-sample varied"></i>长短针</button></div>
        <label for="stitch-length">针迹长度 <output id="length-value">18</output></label><input id="stitch-length" type="range" min="8" max="32" value="18">
        <div class="stitch-actions"><button id="undo" disabled>撤销一笔</button><button id="review">查看作品</button></div>
        <p class="stitch-help">选好丝线，按住鼠标沿花瓣或叶片拖动。针迹随手势铺开。</p>
      </div>
    </section>
  </aside>
  <section class="workspace" aria-labelledby="workspace-title">
    <button id="change-pattern" class="change-pattern">换一稿</button><div class="frame"><div class="frame-top"><h2 id="workspace-title"><img data-decoration="workTitle" alt="" hidden><span>工作区</span></h2></div><div class="paper">
      <div class="embroidery-surface"><canvas id="embroidery-canvas" width="800" height="800" tabindex="0" role="img" aria-label="刺绣布面，按住拖动铺针；方向键移动针尖，空格落针"></canvas><span id="needle-cursor" hidden aria-hidden="true"></span><p id="loading" role="status">正在准备绣布…</p></div>
    </div></div>
    <div class="controls"><button id="previous"><span>←</span> 上一步</button><button id="next"><span>✓</span> 查看作品</button><button id="reset"><span>⟳</span> 重置</button></div>
    <p id="step-status" role="status"></p>
  </section>
  <aside class="reference"><h2>参考效果</h2><div class="reference-art"><img id="color-image" alt="" hidden><div id="color-placeholder" class="placeholder"><span>彩</span><h3>彩色参考图预留区</h3><code></code></div></div><p class="caption">教学示意</p><p class="description">同一纹样，也能呈现不同配色。</p><button id="use-pattern" class="primary" disabled>完成并保存</button><p id="selection-status" role="status"></p></aside>
</main>
