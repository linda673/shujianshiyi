        <li><button data-step="2"><span class="number">3</span><span><strong>顺形定向</strong><small>沿花瓣与叶脉设置针向，让针脚顺着形态延展</small></span></button></li>
        <li><button data-step="3"><span class="number">4</span><span><strong>铺针生光</strong><small>调整针脚长短与疏密，观察丝线层次的变化</small></span></button></li>
