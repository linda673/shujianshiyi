    <section class="panel"><h2 class="panel-title"><span class="seal" aria-hidden="true"><img data-decoration="stepsBadge" alt="" hidden><span>版</span></span>体验步骤</h2>
      <ol class="steps">
        <li><button data-step="0"><span class="number">1</span><span><strong>择稿迎喜</strong><small>选一幅吉祥画稿，把心中的祝愿藏进画里</small></span></button></li>

        <li><button data-step="2"><span class="number">3</span><span><strong>印墨留形</strong><small>将线版印在纸上，留下清晰的年画轮廓</small></span></button></li>
        <li><button data-step="3"><span class="number">4</span><span><strong>敷彩生春</strong><small>为画稿添上色彩，让吉祥与春意跃然纸上</small></span></button></li>
      </ol>
    </section>
    <section class="panel tool-panel"><h2 class="panel-title"><span class="seal" aria-hidden="true">刻</span>选择工具</h2>
      <div class="tool-grid" aria-label="选择刻刀">

        <button class="tool-choice" data-tool="round" aria-pressed="false" disabled><span><img src="assets/tools/round.svg" alt=""></span><span>圆刀</span></button>
        <button class="tool-choice" data-tool="slant" aria-pressed="false" disabled><span><img src="assets/tools/slant.svg" alt=""></span><span>斜刀</span></button>
      </div>
      <p id="tool-help" class="tool-help">先选一把刻刀，再沿木板上的线条移动鼠标。触屏请按住拖动。</p>
      <button id="undo" class="undo-button" disabled>↶ 撤销上一笔</button>
    </section>
  </aside>

    <div class="frame"><button id="change-pattern" class="change-pattern">换一换</button><div class="frame-top"><h2 id="workspace-title"><img data-decoration="workTitle" alt="" hidden><span>工作区</span></h2></div><div class="paper">
